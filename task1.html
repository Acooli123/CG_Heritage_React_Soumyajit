<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox and Grid Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <nav class="navbar">
                <div class="logo">MyLogo</div>

                <ul class="nav-links">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Sidebar</h2>
            <p>Menu Item 1</p>
            <p>Menu Item 2</p>
            <p>Menu Item 3</p>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <h2>Card Layout</h2>

            <div class="card-container">
                <div class="card">
                    <h3>Card 1</h3>
                    <p>This is card one.</p>
                </div>

                <div class="card">
                    <h3>Card 2</h3>
                    <p>This is card two.</p>
                </div>

                <div class="card">
                    <h3>Card 3</h3>
                    <p>This is card three.</p>
                </div>

                <div class="card">
                    <h3>Card 4</h3>
                    <p>This is card four.</p>
                </div>

                <div class="card">
                    <h3>Card 5</h3>
                    <p>This is card five.</p>
                </div>

                <div class="card">
                    <h3>Card 6</h3>
                    <p>This is card six.</p>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>© My day1 Website</p>
        </footer>

    </div>

</body>
</html>
